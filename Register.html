<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Register
    </title>
    <link rel="stylesheet" href="Register.css">
</head>
<body>
    <h1 id="h"> Register | SFDM</h1>
    <section class="container">
        <form id="registerForm">
            <div class="User">
            <label for="username">Username</label>
            <input type="text"  required placeholder="Please Enter Your UserName">
            </div>
              <div class="User">
            <label for="Email">Email</label>
            <input type="email" id="email" required placeholder="Please Enter Your Email">
            </div>
            <div class="Pass">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Please Enter Your Password">
            </div>
              <div class="Pass">
            <label for="password">Confirm Password</label>
            <input type="password" id="confirmPassword" required placeholder="Please Confirm Your Password">
            </div>
            <button type="submit" id="btn">Submit</button>
            <label>you have account already?</label>
            <a href="login.html">Login</a>
        </form>
    </section>
    <footer>
        <h3>©copy right 2027</h3>
        <p>Welcome To Visit SFDM</p>
        <a href="selection.html">Home</a>
    </footer>
    <script>
        document.getElementById("registerForm").addEventListener("submit", function (event) {
            event.preventDefault();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }
            alert("Registration form completed. Please log in.");
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
